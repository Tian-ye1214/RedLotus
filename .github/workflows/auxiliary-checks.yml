name: Auxiliary regression and installation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build and auxiliary test dependencies
        run: python -m pip install '.[dev,bots,speech,pets,browser]' build
      - name: Check source size and reuse budget
        run: python scripts/check_structure.py
      - name: Run source regression
        run: python -m pytest -q tests
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run isolated regression against installed package
        run: python scripts/verify_wheel.py dist
      # pytest exit code 5 (no tests collected) fails this job.
      # These checks never substitute for the documented live API release gates.
