name: Auxiliary regression and installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install '.[dev,browser]' build
      - name: Run isolated auxiliary regression (zero collected tests fail)
        run: python -m pytest tests -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Import installed package outside checkout imports
        run: python -I -c "from importlib.metadata import distribution; d=distribution('RedLotus'); e=next(e for e in d.entry_points if e.name=='redlotus'); assert callable(e.load()); print(d.version)"
